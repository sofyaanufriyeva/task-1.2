<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заголовок домашнего задания</title>
</head>
<body>
    <h1>Привет, учитель!</h1>
</body>
</html>

<!--
lang - подсказывает поисковым роботам и браузерам на каком языке наш сайт и для каких стран продвигать его
charset - сообщает браузеру кодировку документа, чтобы текст правильно читался.
viewport - нужен для адаптации на телефон
--
title - название нашей страницы, выводящейся в названии вкладки
head - раздел для служебной информации, которая не отображается пользователям, но нужна браузеру и поисковым системам
body - это видимая часть страницы, на которой видны все элементы страницы
----
Файл открыла в браузере с помощью Live server, title высвечивается в названии страницы и на экране виден заголовок h1
-->
